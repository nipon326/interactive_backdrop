<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>ร่วมสนุก — Interactive Backdrop</title>
<link rel="stylesheet" href="../shared/theme.css" />
<link rel="stylesheet" href="join.css" />
</head>
<body>
  <header class="join-header">
    <h1>💧 The Flow of Legacy</h1>
    <p>ร่วมส่งความรู้สึกขึ้นจอกันเถอะ</p>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="sticker">✨ สติกเกอร์</button>
    <button class="tab-btn" data-tab="message">💌 ฝากถึงน้องๆ</button>
    <button class="tab-btn" data-tab="question">🎤 ฝากคำถาม</button>
  </nav>

  <main>
    <section id="tab-sticker" class="tab-panel active">
      <p class="hint">แตะสติกเกอร์ให้ลอยขึ้นจอเวทีได้เลย</p>
      <div id="sticker-grid" class="sticker-grid"></div>
    </section>

    <section id="tab-message" class="tab-panel">
      <p class="hint">อยากฝากอะไรถึงน้องๆ ที่ยังทำงานอยู่ — ข้อความจะถูกรวมเป็น Word Cloud ช่วงท้ายงาน</p>
      <form id="message-form">
        <input type="text" id="message-name" placeholder="ชื่อของคุณ" maxlength="60" required />
        <textarea id="message-text" rows="4" placeholder="ฝากอะไรถึงน้องๆ..." maxlength="280" required></textarea>
        <button type="submit" class="btn-primary">ส่งข้อความ</button>
        <p class="status" id="message-status"></p>
      </form>
    </section>

    <section id="tab-question" class="tab-panel">
      <p class="hint">ฝากคำถามถึงบนเวทีได้เลย ทีมงานจะตรวจสอบก่อนขึ้นจอ</p>
      <form id="question-form">
        <input type="text" id="question-name" placeholder="ชื่อของคุณ" maxlength="60" required />
        <textarea id="question-text" rows="4" placeholder="คำถามของคุณ..." maxlength="280" required></textarea>
        <button type="submit" class="btn-primary">ส่งคำถาม</button>
        <p class="status" id="question-status"></p>
      </form>
    </section>
  </main>

  <script type="module" src="join.js?v=1"></script>
</body>
</html>
